<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | GarrisonRom</title>
<link rel="stylesheet" href="../style.css">
<style>
body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--bg);
}
.login-box {
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px;
  width: 100%;
  max-width: 420px;
}
.login-box h2 {
  color: var(--text-heading);
  text-align: center;
  margin-bottom: 8px;
}
.login-box .subtitle {
  color: var(--text-secondary);
  text-align: center;
  font-size: 0.9rem;
  margin-bottom: 28px;
}
.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  color: var(--text-secondary);
  font-size: 0.85rem;
  margin-bottom: 6px;
}
.form-group input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 14px;
  color: var(--text);
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}
.form-group input:focus {
  border-color: var(--blue);
}
.btn-block {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  border: none;
  margin-top: 8px;
}
.error-msg {
  color: var(--red);
  font-size: 0.85rem;
  text-align: center;
  margin-top: 12px;
  min-height: 20px;
}
.back-link {
  display: block;
  text-align: center;
  margin-top: 20px;
  color: var(--text-secondary);
  font-size: 0.9rem;
}
</style>
</head>
<body>

<div class="login-box">
  <h2>🔐 Admin Login</h2>
  <p class="subtitle">登录后可编辑学习心得、研究方向、技术栈等内容</p>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="off">
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter password">
  </div>

  <button class="btn-block btn-primary" onclick="doLogin()">Sign In</button>
  <div class="error-msg" id="error"></div>

  <a href="../index.html" class="back-link">← Back to Home</a>
</div>

<script>
// 预置账号（实际生产环境应走后端验证）
const ADMIN_USER = "garrison";
const ADMIN_PASS = "scut2026";  // 你自己改这个密码

function doLogin() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  const err = document.getElementById('error');

  if (!u || !p) {
    err.textContent = "Please enter both username and password.";
    return;
  }

  if (u === ADMIN_USER && p === ADMIN_PASS) {
    // 生成简单 JWT-like token（前端模拟）
    const token = btoa(JSON.stringify({user: u, exp: Date.now() + 86400000}));
    localStorage.setItem('gr_token', token);
    localStorage.setItem('gr_user', u);
    window.location.href = 'dashboard.html';
  } else {
    err.textContent = "Invalid username or password.";
  }
}

document.getElementById('password').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>

</body>
</html>
